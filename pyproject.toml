[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renku-mnist-job-demo"
version = "0.1.0"
description = "Reusable Renku demo for non-interactive MNIST training jobs from Zenodo data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.0",
  "streamlit>=1.35",
  "plotly>=5.22",
  "torch>=2.2",
  "torchvision>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
